[project]
name = "molopes2"
version = "0.1.0"
description = "Image classification API with MobileNetV2 and ONNX"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
    "fastapi>=0.121.3",
    "jinja2>=3.1.6",
    "numpy>=2.3.5",
    "onnxruntime>=1.23.2",
    "opencv-python-headless>=4.11.0.86",
    "pytest-mock>=3.15.1",
    "python-multipart>=0.0.20",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "black>=25.11.0",
    "httpx>=0.28.1",
    "matplotlib>=3.10.8",
    "mlflow>=3.7.0",
    "onnx>=1.20.0",
    "onnxscript>=0.5.6",
    "pylint>=4.0.3",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
]
