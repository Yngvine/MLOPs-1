# .github/workflows/cd.yml

name: Continuous Deployment

on:
  push:
    branches: [ "Lab02" ]
  pull_request:
    branches: [ "Lab02" ]

jobs:
  #################################################
  # Job 1: Deploy the API to Docker Hub and Render
  #################################################
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # Assumes Dockerfile is in the root directory
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mlops02:latest,${{ secrets.DOCKERHUB_USERNAME }}/mlops02:latest:${{ github.sha }}

      - name: Trigger Render deployment
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_KEY }}

  #########################################################
  # Job 2: Deploy the Gradio App to Hugging Face Spaces
  #########################################################
  deploy-hf-space:
    name: Deploy Hugging Face Space
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch all history so we can switch to the hf-space branch
          fetch-depth: 0

      - name: Switch to hf-space branch
        run: |
          # Check if hf-space branch exists locally, if not, create it from main
          if ! git show-ref --verify --quiet refs/heads/hf-space; then
            git checkout -b hf-space main
          else
            git checkout hf-space
          fi
          git status

      - name: Add Hugging Face remote
        run: git remote add huggingface https://user:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Yngvine/Mlops02

      - name: Push to Hugging Face Spaces
        run: |
          # Force push the local hf-space branch to the main branch of the HF remote
          # The --force is often necessary for HF Spaces deployments
          git push --force huggingface hf-space:main